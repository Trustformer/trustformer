name: Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - name: Build the library, the proofs and the Verilog
        run: nix develop -c make all

      - name: Headline theorems are proved, axiom-free
        run: nix develop -c make theorems

      - name: Generated Verilog has no conflicting drivers or out-of-range selects
        run: nix develop -c make check

      - name: Testbenches
        run: nix develop -c make sim
